[project]
name = "mtgs"
version = "0.2.0"
description = "Micro-Transactional Gradient Synchronization — sub-millisecond fault recovery for distributed Transformer fine-tuning"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Jameel Anwar" }]
keywords = ["distributed-systems", "fault-tolerance", "pytorch", "distributed-training", "2pc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
]

dependencies = [
  "torch",
  "transformers",
  "datasets",
  "accelerate",
  "psutil",
  "pyyaml",
]

[project.urls]
Repository = "https://github.com/salarkhannn/MTGS"
Documentation = "https://github.com/salarkhannn/MTGS#readme"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
